name: Security scans

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Bandit
        run: python -m pip install --upgrade bandit

      - name: Run Bandit
        run: |
          mkdir -p artifacts
          bandit -r backend/app -f json -o artifacts/bandit.json || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run npm audit
        working-directory: frontend
        run: |
          mkdir -p ../artifacts
          npm audit --package-lock-only --json > ../artifacts/npm-audit.json || true

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: artifacts/trivy-fs.json
          exit-code: '0'

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: artifacts/
